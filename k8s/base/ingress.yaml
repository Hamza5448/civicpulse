apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse-ingress
  namespace: civicpulse
  annotations:
    ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80